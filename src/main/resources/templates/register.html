<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinguaLearn</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">LinguaLearn</a>

        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/login}">
                Login
            </a>

            <a class="btn btn-light" th:href="@{/}">
                Home
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="text-center mb-3">Create an Account</h2>

                    <p class="text-center text-muted mb-4">
                        Join LinguaLearn and start learning a new language.
                    </p>

                    <form th:action="@{/register}"
                          th:object="${appUser}"
                          method="post">

                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                th:field="*{fullName}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                placeholder="Enter your full name">

                            <div class="invalid-feedback"
                                 th:errors="*{fullName}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                th:field="*{email}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                placeholder="Enter your email">

                            <div class="invalid-feedback"
                                 th:errors="*{email}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                placeholder="Enter at least 6 characters">

                            <div class="invalid-feedback"
                                 th:errors="*{password}">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary">
                                Register
                            </button>
                        </div>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a th:href="@{/login}">Login here</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
