<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - LinguaLearn</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">LinguaLearn</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/about">About</a>
            <a class="nav-link" href="/languages">Languages</a>
            <a class="nav-link" href="/courses">Courses</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4">Add a New Course</h1>

                    <form th:action="@{/courses}"
                          th:object="${course}"
                          method="post">

                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Course Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                th:field="*{title}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">

                            <div class="invalid-feedback"
                                 th:errors="*{title}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                th:field="*{description}"
                                class="form-control"
                                rows="4"
                                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:errors="*{description}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="language" class="form-label">
                                Language
                            </label>

                            <select
                                id="language"
                                th:field="*{language}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('language')} ? 'is-invalid'">

                                <option value="">Select a language</option>
                                <option value="French">French</option>
                                <option value="English">English</option>
                                <option value="Spanish">Spanish</option>
                                <option value="Japanese">Japanese</option>
                                <option value="Russian">Russian</option>
                                <option value="Italian">Italian</option>
                                <option value="Swahili">Swahili</option>
                                <option value="German">German</option>
                                <option value="Arabic">Arabic</option>
                                <option value="Mandarin">Mandarin</option>
                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{language}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="difficulty" class="form-label">
                                Difficulty
                            </label>

                            <select
                                id="difficulty"
                                th:field="*{difficulty}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('difficulty')} ? 'is-invalid'">

                                <option value="">Select difficulty</option>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{difficulty}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="instructorName" class="form-label">
                                Instructor Name
                            </label>

                            <input
                                type="text"
                                id="instructorName"
                                th:field="*{instructorName}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('instructorName')} ? 'is-invalid'">

                            <div class="invalid-feedback"
                                 th:errors="*{instructorName}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="durationWeeks" class="form-label">
                                    Duration in Weeks
                                </label>

                                <input
                                    type="number"
                                    id="durationWeeks"
                                    th:field="*{durationWeeks}"
                                    class="form-control"
                                    min="1"
                                    max="52"
                                    th:classappend="${#fields.hasErrors('durationWeeks')} ? 'is-invalid'">

                                <div class="invalid-feedback"
                                     th:errors="*{durationWeeks}">
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">
                                    Price
                                </label>

                                <input
                                    type="number"
                                    id="price"
                                    th:field="*{price}"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">

                                <div class="invalid-feedback"
                                     th:errors="*{price}">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Course
                        </button>

                        <a href="/courses" class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
