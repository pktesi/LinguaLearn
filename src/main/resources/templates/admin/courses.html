<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Courses - LinguaLearn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            LinguaLearn
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/courses}">
                Courses
            </a>

            <a class="nav-link" th:href="@{/courses/new}">
                Add Course
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="d-inline">

                <button type="submit"
                        class="btn btn-outline-light ms-2">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Course Administration</h1>

            <p class="text-muted mb-0">
                View, edit, and delete LinguaLearn courses.
            </p>
        </div>

        <a th:href="@{/courses/new}"
           class="btn btn-primary">
            Add New Course
        </a>

    </div>

    <div th:if="${#lists.isEmpty(courses)}"
         class="alert alert-info">

        No courses are currently available.

    </div>

    <div class="card shadow-sm"
         th:unless="${#lists.isEmpty(courses)}">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-striped table-hover mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Language</th>
                        <th>Difficulty</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="course : ${courses}">

                        <td th:text="${course.id}">
                            1
                        </td>

                        <td th:text="${course.title}">
                            Course title
                        </td>

                        <td th:text="${course.language}">
                            French
                        </td>

                        <td th:text="${course.difficulty}">
                            Beginner
                        </td>

                        <td class="text-center">

                            <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                               class="btn btn-sm btn-warning me-2">
                                Edit
                            </a>

                            <form th:action="@{/admin/courses/delete/{id}(id=${course.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this course?');">

                                <button type="submit"
                                        class="btn btn-sm btn-danger">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>
                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
